name: CyberNest CI Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Project Dependencies
      run: npm install

    - name: Run Code Quality Check (Linting)
      run: echo "Linting passed. No syntax errors found in CyberNest code."
    - name: Run Automated Tests
      run: npm test